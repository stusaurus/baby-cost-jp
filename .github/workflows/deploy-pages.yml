name: Build and deploy baby-cost-jp

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 21 * * *" # 06:17 JST

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore price history cache
        uses: actions/cache@v4
        with:
          path: .price-cache
          key: baby-cost-price-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            baby-cost-price-history-
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Test shopping interactions
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Build live comparison pages
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          GA_MEASUREMENT_ID: G-GFVSZ8YDQ5
          SITE_URL: https://stusaurus.github.io/baby-cost-jp/
        run: python scripts/build_site.py --pages 2
      - name: Generate SEO discovery files
        env:
          SITE_URL: https://stusaurus.github.io/baby-cost-jp/
        run: python scripts/generate_seo_files.py
      - name: Validate generated pages and product quality
        run: python scripts/validate_site.py
      - name: Add IndexNow verification key
        run: printf '%s' '7d4f93c2a6814eb5b0d87f216ca9e403' > site/7d4f93c2a6814eb5b0d87f216ca9e403.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    name: Notify IndexNow
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs to IndexNow
        env:
          SITE_URL: https://stusaurus.github.io/baby-cost-jp/
          INDEXNOW_KEY: 7d4f93c2a6814eb5b0d87f216ca9e403
        run: |
          python - <<'PY'
          import json, os, urllib.request, xml.etree.ElementTree as ET
          base=os.environ["SITE_URL"]; key=os.environ["INDEXNOW_KEY"]; key_url=base+key+".txt"
          if urllib.request.urlopen(key_url, timeout=20).read().decode().strip()!=key: raise SystemExit("IndexNow key verification failed")
          xml=urllib.request.urlopen(base+"sitemap.xml", timeout=20).read()
          root=ET.fromstring(xml); urls=[e.text.strip() for e in root.iter() if e.tag.endswith("loc") and e.text]
          req=urllib.request.Request("https://api.indexnow.org/IndexNow", data=json.dumps({"host":"stusaurus.github.io","key":key,"keyLocation":key_url,"urlList":urls}).encode(), headers={"Content-Type":"application/json; charset=utf-8"}, method="POST")
          with urllib.request.urlopen(req, timeout=30) as r: print("IndexNow", r.status, "URLs", len(urls))
          PY
